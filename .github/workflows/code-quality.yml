name: Code Quality

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  #  clang-tidy static analysis
  # ─────────────────────────────────────────────
  clang-tidy:
    name: "clang-tidy"
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang clang-tidy

      - name: Configure (generate compile_commands.json)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DHAPI_BUILD_TESTS=ON \
            -DHAPI_BUILD_EXAMPLES=ON

      - name: Build (required to generate headers)
        run: cmake --build build --parallel $(nproc)

      - name: Run clang-tidy on Core and System sources
        run: |
          FILES=$(find Core/src System/src Application/src Services/src \
                  Bindings/c/src \
                  -name '*.cpp' | tr '\n' ' ')
          clang-tidy \
            -p build \
            --warnings-as-errors='*' \
            --checks='-*,readability-*,modernize-*,performance-*,bugprone-*,clang-analyzer-*,-readability-magic-numbers,-readability-function-cognitive-complexity,-modernize-use-trailing-return-type' \
            $FILES

  # ─────────────────────────────────────────────
  #  clang-format style check
  # ─────────────────────────────────────────────
  clang-format:
    name: "clang-format"
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Check formatting
        run: |
          FILES=$(find Core System Application Services Bindings/c \
                  -name '*.cpp' -o -name '*.hpp' -o -name '*.h' | tr '\n' ' ')
          clang-format --dry-run --Werror $FILES && echo "Formatting OK."

  # ─────────────────────────────────────────────
  #  CMake lint (cmake-lint / cmakelang)
  # ─────────────────────────────────────────────
  cmake-lint:
    name: "cmake-lint"
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cmake-lint
        run: pip install cmakelang

      - name: Lint CMakeLists.txt
        run: cmake-lint CMakeLists.txt --disabled-codes C0301 || true
